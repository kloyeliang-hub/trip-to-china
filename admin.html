<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beijing Trip Editor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f1eb;color:#222;font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.top{position:sticky;top:0;z-index:5;background:#3f2e29;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:20px;margin:0}.actions{display:flex;gap:8px}button{border:0;border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:700}.primary{background:#fff;color:#3f2e29}.save{background:#b9e769}.wrap{max-width:1000px;margin:24px auto;padding:0 16px}.day{background:#fff;border:1px solid #ddd5ca;border-radius:18px;padding:18px;margin-bottom:16px}.row{display:grid;grid-template-columns:40px 1fr 1fr 1fr 110px 110px 70px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid #eee}.row:first-of-type{border-top:0}.handle{cursor:grab;font-size:20px;text-align:center}.row input,.day input{width:100%;padding:9px;border:1px solid #d8d0c5;border-radius:8px}.dayhead{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}.small{font-size:12px;color:#777}.danger{background:#ffe1df}.add{margin-top:10px;background:#eee}.status{font-size:13px}.login{max-width:480px;margin:60px auto;background:#fff;padding:24px;border-radius:18px;border:1px solid #ddd5ca}.login input{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccc;border-radius:9px}
@media(max-width:850px){.row{grid-template-columns:35px 1fr}.row input,.row button{grid-column:2}.dayhead{grid-template-columns:1fr}}
</style></head><body>
<div class="top"><h1>北京行程 Visual Editor</h1><div class="actions"><span id="status" class="status"></span><button class="primary" onclick="preview()">Preview</button><button class="save" onclick="publish()">Save & Publish</button></div></div>
<div id="app" class="wrap"></div>
<script>
let db;
async function load(){let r=await fetch("/data/itinerary.json?"+Date.now());db=await r.json();render()}
function render(){app.innerHTML="";db.days.forEach((d,di)=>{let box=document.createElement("section");box.className="day";box.innerHTML=`<div class="dayhead"><input value="${esc(d.date.zh)}" onchange="db.days[${di}].date.zh=this.value" placeholder="中文日期"><input value="${esc(d.date.fa)}" onchange="db.days[${di}].date.fa=this.value" placeholder="Persian date"><input value="${esc(d.date.de)}" onchange="db.days[${di}].date.de=this.value" placeholder="German date"></div><div id="stops-${di}"></div><button class="add" onclick="addStop(${di})">+ Add Stop</button>`;app.appendChild(box);let list=box.querySelector("#stops-"+di);d.stops.forEach((s,si)=>list.appendChild(row(di,si,s)))})}
function row(di,si,s){let e=document.createElement("div");e.className="row";e.draggable=true;e.dataset.index=si;e.innerHTML=`<div class="handle">☰</div><input value="${esc(s.zh)}" onchange="db.days[${di}].stops[${si}].zh=this.value" placeholder="中文"><input value="${esc(s.fa)}" onchange="db.days[${di}].stops[${si}].fa=this.value" placeholder="فارسی"><input value="${esc(s.de)}" onchange="db.days[${di}].stops[${si}].de=this.value" placeholder="Deutsch"><input type="number" step="any" value="${s.lat}" onchange="db.days[${di}].stops[${si}].lat=+this.value" placeholder="Lat"><input type="number" step="any" value="${s.lng}" onchange="db.days[${di}].stops[${si}].lng=+this.value" placeholder="Lng"><button class="danger" onclick="del(${di},${si})">Delete</button>`;
 e.ondragstart=ev=>ev.dataTransfer.setData("text/plain",si);e.ondragover=ev=>ev.preventDefault();e.ondrop=ev=>{ev.preventDefault();let from=+ev.dataTransfer.getData("text/plain"),to=si;if(from!==to){let x=db.days[di].stops.splice(from,1)[0];db.days[di].stops.splice(to,0,x);render()}};return e}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;")}
function addStop(di){db.days[di].stops.push({zh:"新地点",fa:"مکان جدید",de:"Neuer Ort",lat:39.9042,lng:116.4074});render()}
function del(di,si){db.days[di].stops.splice(si,1);render()}
function preview(){localStorage.setItem("itinerary-preview",JSON.stringify(db));window.open("/","_blank")}
async function publish(){status.textContent="Saving…";let r=await fetch("/.netlify/functions/save-itinerary",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(db)});let x=await r.json().catch(()=>({}));status.textContent=r.ok?"Saved. Netlify is deploying…":("Error: "+(x.error||r.status));}
load();
</script></body></html>
